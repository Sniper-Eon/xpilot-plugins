name: plugin checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      X: ${{ github.workspace }}/xpilot
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: Sniper-Eon/xpilot
        ref: xpilot
        path: xpilot
    - run: git -C xpilot submodule update --init --depth 1 msgq_repo
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyzmq numpy pycapnp pytest zstandard setproctitle cython scons setuptools cryptography
    - name: Build msgq
      working-directory: xpilot/msgq_repo
      run: scons -j4 msgq/ipc_pyx.so
    - name: Classifier failure modes
      run: python3 tools/pr_risk_check.py > /tmp/pr_risk_check.json
    - name: Archives and index match the source
      run: python3 tools/build_index.py --check
    - name: Two X-Pilot profile contract
      run: python3 tools/variant_contract_check.py
    - name: Stage both profiles without activating
      run: |
        python3 tools/prepare_profile.py --host "$X" --profile cpdazi --destination /tmp/xpilot-cpdazi-profile
        python3 tools/prepare_profile.py --host "$X" --profile tesnav --destination /tmp/xpilot-tesnav-profile
    - name: Plugin tests
      working-directory: plugins
      run: PYTHONPATH=$X:$X/msgq_repo:$X/opendbc_repo python3 -m pytest -q -p no:cacheprovider .
    - name: Store end to end (install, discover, enable)
      run: PYTHONPATH=$X/msgq_repo python3 $X/tools/sp_tesla_e2e/store_e2e.py --repo .
    - name: Tell the owner main is broken
      if: failure() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create --title "main checks failed at ${GITHUB_SHA::10}" --body "@Sniper-Eon $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
